# Regenerates the stat cards in profile/ so the README never depends on a
# public card server. CARDS_TOKEN is a classic PAT (repo, read:user) so the
# cards count private repos too; GITHUB_TOKEN would only see public ones.
name: Update README cards

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=drasolo&show_icons=true&hide_rank=true&include_all_commits=true&hide=stars,issues,prs,contribs&show=contributions,all_time_contribs&theme=light_github
          path: profile/stats-light.svg
          token: ${{ secrets.CARDS_TOKEN }}
          fail_on_error: true

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=drasolo&show_icons=true&hide_rank=true&include_all_commits=true&hide=stars,issues,prs,contribs&show=contributions,all_time_contribs&theme=dark_github
          path: profile/stats-dark.svg
          token: ${{ secrets.CARDS_TOKEN }}
          fail_on_error: true

      - name: Languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=drasolo&layout=compact&langs_count=6&role=OWNER,COLLABORATOR&hide=jupyter notebook,batchfile,cmake,jinja&theme=light_github
          path: profile/langs-light.svg
          token: ${{ secrets.CARDS_TOKEN }}
          fail_on_error: true

      - name: Languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=drasolo&layout=compact&langs_count=6&role=OWNER,COLLABORATOR&hide=jupyter notebook,batchfile,cmake,jinja&theme=dark_github
          path: profile/langs-dark.svg
          token: ${{ secrets.CARDS_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
